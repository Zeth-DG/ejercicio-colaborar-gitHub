<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title>Pancito web</title>
</head>
<body>
     <div class="text-bg-primary p-3"> <!--fondo azul con padding de 3-->

        
    <header>
        <div class="container mb-5">

        <div class="row">
            <div class="col">
                <h1 class="h3">Pancito de hoy</h1>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <nav>
                    <a class="text-decoration-none me-3" href="#">Inicio |</a>
                    <a class="text-decoration-none me-3" href="#">Tipos de panes |</a>
                    <a class="text-decoration-none" href="#">Panes</a>
                </nav>
            </div>
        </div>
        </div>
    </header>

<main>

    <section>
        <!-- buscador -->
    <div class="container">

        <div class="row">        <!---arreglo en fila -->

            <div class="col">      <!---arreglo en columna para buscador y botón -->

                <h2>Encuentra el pan para acompañar tu café del día</h2>

                <div class="input-group">
                    <input
                        type="text"                        
                        class="form-control"
                        placeholder="🔎 Buscar pan..."
                    >

                    <button
                        class="btn btn-primary"
                        type="button">
                        Buscar
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>  <!-- aquí termina buscador-->
    


    </div>
