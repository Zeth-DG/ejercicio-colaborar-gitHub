<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title>Pancito web</title>
</head>
<body>
     <div class="text-bg-primary p-3"> <!--fondo azul con padding de 3-->

        
    <header>
        <div class="container mb-5">

        <div class="row">
            <div class="col">
                <h1 class="h3">Pancito de hoy</h1>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <nav>
                    <a class="text-decoration-none me-3" href="#">Inicio |</a>
                    <a class="text-decoration-none me-3" href="#">Tipos de panes |</a>
                    <a class="text-decoration-none" href="#">Panes</a>
                </nav>
            </div>
        </div>
        </div>
    </header>

<main>

    <section>
        <!-- buscador -->
    <div class="container">

        <div class="row">        <!---arreglo en fila -->

            <div class="col">      <!---arreglo en columna para buscador y botón -->

                <h2>Encuentra el pan para acompañar tu café del día</h2>

                <div class="input-group">
                    <input
                        type="text"                        
                        class="form-control"
                        placeholder="🔎 Buscar pan..."
                    >

                    <button
                        class="btn btn-primary"
                        type="button">
                        Buscar
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>  <!-- aquí termina buscador-->

<section>
        <!-- libros -->
         <div class="container my-5">
        
        <!-- Título principal -->
        <h1 class="text-center text-primary mb-5 fw-bold">CATÁLOGO DE PANES</h1>

        <!-- Fila que organiza las columnas -->
        <div class="row g-4 justify-content-center">
            
            <!-- Tarjeta de libro 1 -->
            <div class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">
                <div class="card shadow-sm" style="width: 18rem;">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMy9xzVIdHkrTIGS26vMLesGJCtVmeIQ8Ie3g8qoD_7A&s=10" class="card-img-top" alt="Portada Eloquent JavaScript">
                    <div class="card-body">
                        <h5 class="card-title">Concha Rellena</h5>
                        <p class="card-text">$50</p>
                        <a href="#" class="btn btn-primary w-100">Comprar</a>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de libro 2 -->
            <div class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">
                <div class="card shadow-sm" style="width: 18rem;">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnUZEXqwBsXpUGgdNczhaBJ6eB4RudLF87c_5GG-ahfg&s=10" class="card-img-top" alt="Portada Eloquent JavaScript">
                    <div class="card-body">
                        <h5 class="card-title">Cuernito</h5>
                        <p class="card-text">$25</p>
                        <a href="#" class="btn btn-primary w-100">Comprar</a>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de libro 3 -->

            <div class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">
                <div class="card shadow-sm" style="width: 18rem;">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUllqmYViQFFXGawpKyWbLGwcc6YjTLKiLdlYT5TbsyQ&s=10" class="card-img-top" alt="Portada Eloquent JavaScript">
                    <div class="card-body">
                        <h5 class="card-title">Donas</h5>
                        <p class="card-text">$25</p>
                        <a href="#" class="btn btn-primary w-100">Comprar</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    </div>
